<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearthboard Access</title>
    <meta name="theme-color" content="#dd6b20" />
    <script src="/theme-preload.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="site-nav card" aria-label="Primary">
        <a class="nav-brand" href="/">Hearthboard</a>
        <div class="nav-tools">
          <div class="nav-links">
            <a class="nav-link-icon" href="/" data-tooltip="Calendar" aria-label="Calendar">
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1Zm12 8H5v9h14v-9Zm-10 2h2v2H9v-2Zm4 0h2v2h-2v-2Zm4 0h2v2h-2v-2Zm-8 4h2v2H9v-2Zm4 0h2v2h-2v-2Z"></path>
              </svg>
            </a>
            <a class="nav-link-icon" href="/gallery" data-tooltip="Gallery" aria-label="Gallery">
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M5 4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H5Zm14 2v8.5l-3.3-3.3a1 1 0 0 0-1.4 0L10 15.6l-2.3-2.3a1 1 0 0 0-1.4 0L5 14.6V6h14ZM8 9.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"></path>
              </svg>
            </a>
            <a class="nav-link-icon" href="/assistant" data-tooltip="Jody AI" aria-label="Jody AI">
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M12 2c.45 0 .85.3.97.74l1.4 4.53a3 3 0 0 0 1.96 1.96l4.53 1.4a1 1 0 0 1 0 1.92l-4.53 1.4a3 3 0 0 0-1.96 1.96l-1.4 4.53a1.01 1.01 0 0 1-1.94 0l-1.4-4.53a3 3 0 0 0-1.96-1.96l-4.53-1.4a1 1 0 0 1 0-1.92l4.53-1.4a3 3 0 0 0 1.96-1.96l1.4-4.53A1 1 0 0 1 12 2Z"></path>
                <path d="M19.5 2.5c.22 0 .42.15.48.37l.4 1.25a1 1 0 0 0 .6.6l1.25.4a.5.5 0 0 1 0 .96l-1.25.4a1 1 0 0 0-.6.6l-.4 1.25a.5.5 0 0 1-.96 0l-.4-1.25a1 1 0 0 0-.6-.6l-1.25-.4a.5.5 0 0 1 0-.96l1.25-.4a1 1 0 0 0 .6-.6l.4-1.25a.5.5 0 0 1 .48-.37Z"></path>
              </svg>
            </a>
            <a class="nav-link-icon" href="/stats" data-tooltip="Stats" aria-label="Stats">
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M12 4a9 9 0 0 0-8.48 12.03 1 1 0 0 0 .94.67h15.08a1 1 0 0 0 .94-.67A9 9 0 0 0 12 4Zm6.83 10H5.17a7 7 0 1 1 13.66 0Zm-3.52-4.3a1 1 0 0 1 0 1.41l-2.51 2.51a1.5 1.5 0 1 1-1.41-1.41l2.51-2.51a1 1 0 0 1 1.41 0Z"></path>
              </svg>
            </a>
          </div>
          <label class="theme-toggle" aria-label="Toggle dark mode">
            <span class="theme-toggle-copy">Night mode</span>
            <input class="theme-toggle-input" type="checkbox" data-theme-toggle />
            <span class="theme-toggle-track" aria-hidden="true">
              <span class="theme-toggle-thumb"></span>
            </span>
          </label>
        </div>
      </nav>

      <main class="access-layout">
        <section class="card access-card">
          <p class="meta-label">Protected access</p>
          <h1>Protected page</h1>
          <p id="access-copy" class="hero-text">
            Enter your configured remote-access password to continue.
          </p>

          <form id="access-form" class="assistant-form">
            <label class="assistant-prompt-label" for="access-password">
              <span class="meta-label">Password</span>
              <input id="access-password" name="password" type="password" autocomplete="current-password" required />
            </label>
            <p id="access-error" class="form-error" hidden></p>
            <div class="assistant-form-actions">
              <a class="button button-secondary" href="/gallery">Open Gallery Instead</a>
              <button class="button button-primary" type="submit">Unlock</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="/theme.js"></script>
    <script type="module" src="/access.js"></script>
  </body>
</html>
