services:
  hearthboard:
    build:
      context: .
    container_name: hearthboard
    ports:
      - "42069:42069"
    environment:
      HOST: 0.0.0.0
      PORT: 42069
      DATA_DIR: /app/data
      APP_TIMEZONE: America/Port-au-Prince
      HOUSEHOLD_NAME: Hearthboard Household
      MEDIA_LIBRARY_ROOTS: '[{"id":"drone","label":"Drone pictures","path":"/libraries/drone"}]'
    volumes:
      - hearthboard-data:/app/data
      - type: bind
        source: E:/Drone
        target: /libraries/drone
        read_only: true
    restart: unless-stopped

volumes:
  hearthboard-data:
