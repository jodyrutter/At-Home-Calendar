services:
  postgres:
    image: postgres:16-alpine
    container_name: hearthboard-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-hearthboard}"
      POSTGRES_USER: "${POSTGRES_USER:-hearthboard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - hearthboard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hearthboard} -d ${POSTGRES_DB:-hearthboard}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
  hearthboard:
    build:
      context: .
    container_name: hearthboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 42069
      DATA_DIR: /app/data
      DATABASE_URL: "postgresql://${POSTGRES_USER:-hearthboard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-hearthboard}"
      APP_TIMEZONE: America/Port-au-Prince
      HOUSEHOLD_NAME: Hearthboard Household
      TRUST_PROXY_HEADERS: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: hearthboard-assistant
      OLLAMA_FALLBACK_MODEL: qwen2.5:7b
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_AWAKE_KEEP_ALIVE: 5m
      OLLAMA_TIMEOUT_MS: 120000
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      MICROSOFT_OAUTH_CLIENT_ID: "${MICROSOFT_OAUTH_CLIENT_ID:-}"
      MICROSOFT_OAUTH_CLIENT_SECRET: "${MICROSOFT_OAUTH_CLIENT_SECRET:-}"
      INTEGRATION_TOKEN_ENCRYPTION_KEY: "${INTEGRATION_TOKEN_ENCRYPTION_KEY:-}"
      INTEGRATION_PUBLIC_ORIGIN: "${INTEGRATION_PUBLIC_ORIGIN:-https://${HEARTHBOARD_PUBLIC_DOMAIN:-jodyrutter-sh.duckdns.org}}"
      MEDIA_LIBRARY_ROOTS: '[{"id":"drone","label":"Drone pictures","path":"/libraries/drone"},{"id":"japan","label":"Japan","path":"/libraries/japan","writable":true},{"id":"general","label":"General","path":"/libraries/general","excludePaths":["Pretty Pictures"],"writable":true},{"id":"phone","label":"Phone","path":"/libraries/phone","authMode":"always","quarantinePath":"/libraries/phone-quarantine","writable":true}]'
    volumes:
      - hearthboard-data:/app/data
      - type: bind
        source: E:/Drone
        target: /libraries/drone
        read_only: true
      - type: bind
        source: D:/Home/Japan-photos
        target: /libraries/japan
      - type: bind
        source: D:/Home/Pictures
        target: /libraries/general
      - type: bind
        source: D:/Home/Phone-photos
        target: /libraries/phone
      - type: bind
        source: D:/Home/Phone-photos-Quarantine
        target: /libraries/phone-quarantine
    ports:
      - "127.0.0.1:42070:42069"
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    container_name: hearthboard-caddy
    depends_on:
      - hearthboard
    ports:
      - "80:80"
      - "443:443"
      - "42069:443"
    environment:
      HEARTHBOARD_LOCAL_SITE_ADDRESSES: "${HEARTHBOARD_LOCAL_SITE_ADDRESSES:-localhost 127.0.0.1 192.168.1.118}"
      HEARTHBOARD_PUBLIC_DOMAIN: "${HEARTHBOARD_PUBLIC_DOMAIN:-jodyrutter-sh.duckdns.org}"
      HEARTHBOARD_DEFAULT_SNI: "${HEARTHBOARD_DEFAULT_SNI:-192.168.1.118}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  hearthboard-postgres:
  hearthboard-data:
  caddy-data:
  caddy-config:
